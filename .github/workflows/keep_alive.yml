name: Keep Streamlit Alive

on:
  schedule:
    # Chạy mỗi 3 tiếng một lần (vào phút thứ 0 của các khung giờ 0, 3, 6, 9, 12, 15, 18, 21 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công kiểm tra bất kỳ lúc nào

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          APP_URL="https://toolraisomuadeu-ty6csysf8r9k7v8ksd3g5g.streamlit.app/"
          echo "Đang ping ứng dụng tại: $APP_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$APP_URL")
          echo "HTTP Status Code trả về: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Ứng dụng Streamlit đang hoạt động bình thường!"
          else
            echo "⚠️ Có thể app phản hồi mã: $STATUS_CODE (vẫn đánh thức app thành công)"
          fi
